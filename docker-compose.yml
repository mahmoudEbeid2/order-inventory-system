services:
  app:
    container_name: order-inventory-app
    build:
      context: .
      target: production
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads

  worker:
    container_name: order-inventory-worker
    build:
      context: .
      target: production
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["sh", "./scripts/start-worker.sh"]
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads

  postgres:
    image: postgres:18
    container_name: order-inventory-db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-order_inventory_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: order-inventory-redis
    restart: always

volumes:
  postgres_data:
  uploads_data:
