services:
  app:
    container_name: order-inventory-app
    build:
      context: .
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:18
    container_name: order-inventory-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-order_inventory_db}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-order_inventory_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: order-inventory-redis
    restart: always

volumes:
  postgres_data:
