type: object
properties:
  success:
    type: boolean
    example: false
  message:
    type: string
    example: Validation failed.
  error:
    type: object
    properties:
      code:
        type: string
        example: VALIDATION_FAILED
      details:
        type: array
        items:
          type: object
          properties:
            field:
              type: string
              example: email
            message:
              type: string
              example: Invalid email address
