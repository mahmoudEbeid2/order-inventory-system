openapi: 3.0.0
info:
  title: Order & Inventory Management System API
  version: 1.0.0
  description: API documentation for the Order and Inventory Management System.
servers:
  - url: http://localhost:3000/api
    description: Development Server
paths:
  /auth/signup:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Create a new customer account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Jane Doe
                email:
                  type: string
                  format: email
                  example: jane@example.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.response'
        '400':
          description: Bad Request / Validation Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '409':
          description: Conflict - Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /auth/login:
    post:
      tags:
        - Auth
      summary: User Login
      description: Authenticate user credentials and return access and refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
                password:
                  type: string
                  format: password
                  example: admin123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.response'
        '400':
          description: Validation Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh Access Token
      description: Use a valid refresh token to obtain a new access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsIn...
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Token refreshed successfully
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsIn...
        '400':
          description: Missing refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /products:
    get:
      tags:
        - Products
      summary: List active products
      description: Retrieve a paginated and filtered list of active (non-deleted) products.
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: string
            default: '1'
        - name: limit
          in: query
          description: Items per page
          schema:
            type: string
            default: '10'
        - name: sort
          in: query
          description: Sorting criteria (e.g. price, -createdAt)
          schema:
            type: string
        - name: search
          in: query
          description: Search query (matches sku or name)
          schema:
            type: string
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/paginated.products'
    post:
      tags:
        - Products
      summary: Create a new product
      description: Add a new product to the catalog. Restricted to ADMIN.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sku
                - name
                - price
                - stockQuantity
              properties:
                sku:
                  type: string
                  example: PROD-004
                name:
                  type: string
                  example: Mechanical Keyboard
                price:
                  type: number
                  example: 89.99
                stockQuantity:
                  type: integer
                  example: 50
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/single.product'
        '400':
          description: Validation Failed / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Forbidden (Only ADMIN can access)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /products/archive:
    get:
      tags:
        - Products
      summary: List soft-deleted products (Archive)
      description: Retrieve a paginated and filtered list of soft-deleted products. Restricted to ADMIN.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: string
            default: '1'
        - name: limit
          in: query
          description: Items per page
          schema:
            type: string
            default: '10'
        - name: sort
          in: query
          description: Sorting criteria
          schema:
            type: string
        - name: search
          in: query
          description: Search query
          schema:
            type: string
      responses:
        '200':
          description: Archived products retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/paginated.products'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Forbidden (Only ADMIN can access)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      description: Retrieve detailed information for a single active product by its ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The product ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/single.product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    put:
      tags:
        - Products
      summary: Update product details
      description: Modify properties of an existing product. Restricted to ADMIN.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The product ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: string
                  example: PROD-004-UPDATED
                name:
                  type: string
                  example: Updated Mouse Name
                price:
                  type: number
                  example: 29.99
                stockQuantity:
                  type: integer
                  example: 120
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/single.product'
        '400':
          description: Validation Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    delete:
      tags:
        - Products
      summary: Soft delete a product
      description: Mark a product as deleted in the catalog. Restricted to ADMIN.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The product ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Product deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /orders:
    get:
      tags:
        - Orders
      summary: List orders
      description: Retrieve a paginated and filtered list of orders. Customers can only see their own orders, while ADMINs can view all orders.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: string
            default: '1'
        - name: limit
          in: query
          description: Items per page
          schema:
            type: string
            default: '10'
        - name: status
          in: query
          description: Filter by order status
          schema:
            type: string
            enum:
              - PENDING
              - COMPLETED
              - CANCELLED
        - name: minAmount
          in: query
          description: Filter by minimum total amount
          schema:
            type: string
        - name: startDate
          in: query
          description: Filter by starting date-time range (ISO format)
          schema:
            type: string
        - name: endDate
          in: query
          description: Filter by ending date-time range (ISO format)
          schema:
            type: string
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/paginated.orders'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    post:
      tags:
        - Orders
      summary: Create a new order
      description: Check inventory stock, deduct stock atomically within a database transaction, and create a new order. Concurrency is handled to prevent race conditions. Queues a background job to send an invoice email with a PDF attachment.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - productId
                      - quantity
                    properties:
                      productId:
                        type: string
                        format: uuid
                        example: d5cbb1fa-4fbb-49e0-811c-c7662b2e88a0
                      quantity:
                        type: integer
                        minimum: 1
                        example: 2
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/single.order'
        '400':
          description: Bad Request (Invalid parameters / insufficient stock)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessResponse:
      $ref: '#/components/schemas/success'
    ErrorResponse:
      $ref: '#/components/schemas/error'
    AuthResponse:
      $ref: '#/components/schemas/auth.response'
    OrderResponse:
      $ref: '#/components/schemas/order'
    PaginatedProductsResponse:
      $ref: '#/components/schemas/paginated.products'
    PaginatedOrdersResponse:
      $ref: '#/components/schemas/paginated.orders'
    SingleProductResponse:
      $ref: '#/components/schemas/single.product'
    SingleOrderResponse:
      $ref: '#/components/schemas/single.order'
    auth.response:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login successful
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: d3b07384-d113-49cd-a5d6-8cf616f73e72
                name:
                  type: string
                  example: Admin User
                email:
                  type: string
                  example: admin@example.com
                role:
                  type: string
                  enum:
                    - ADMIN
                    - CUSTOMER
                  example: ADMIN
            accessToken:
              type: string
              example: eyJhbGciOiJIUzI1NiIsIn...
            refreshToken:
              type: string
              example: eyJhbGciOiJIUzI1NiIsIn...
    error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed.
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_FAILED
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: email
                  message:
                    type: string
                    example: Invalid email address
    product:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a3f01c89-281b-4f51-b847-cf42d38e217e
        sku:
          type: string
          example: PROD-746382
        name:
          type: string
          example: Wireless Mouse
        price:
          type: string
          example: '25.99'
        stockQuantity:
          type: integer
          example: 100
        isDeleted:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: '2026-06-08T12:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-08T12:05:00.000Z'
    meta:
      type: object
      properties:
        total:
          type: integer
          example: 10
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        totalPages:
          type: integer
          example: 1
    paginated.products:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Products retrieved successfully
        data:
          type: array
          items:
            $ref: '#/components/schemas/product'
        meta:
          $ref: '#/components/schemas/meta'
    single.product:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Product operation successful
        data:
          $ref: '#/components/schemas/product'
    order:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        userId:
          type: string
          format: uuid
          example: a3cdfb8a-7d2d-48e0-bb15-0d2d3e1d3e8e
        status:
          type: string
          enum:
            - PENDING
            - COMPLETED
            - CANCELLED
          example: PENDING
        totalAmount:
          type: number
          example: 179.98
        createdAt:
          type: string
          format: date-time
          example: '2026-06-08T11:22:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-08T11:22:00.000Z'
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: f8c5b5bb-7b89-4a37-b715-4fa1b5ef970c
              productId:
                type: string
                format: uuid
                example: d5cbb1fa-4fbb-49e0-811c-c7662b2e88a0
              quantity:
                type: integer
                example: 2
              priceAtPurchase:
                type: number
                example: 89.99
              product:
                type: object
                properties:
                  name:
                    type: string
                    example: Mechanical Keyboard
                  sku:
                    type: string
                    example: KEYB-MECH-01
    paginated.orders:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Orders retrieved successfully
        data:
          type: array
          items:
            $ref: '#/components/schemas/order'
        meta:
          $ref: '#/components/schemas/meta'
    single.order:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Order operation successful
        data:
          $ref: '#/components/schemas/order'
    success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Action completed successfully
        data:
          type: object
