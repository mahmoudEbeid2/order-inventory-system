get:
  tags:
    - Orders
  summary: List orders
  description: Retrieve a paginated and filtered list of orders. Customers can only see their own orders, while ADMINs can view all orders.
  security:
    - BearerAuth: []
  parameters:
    - name: page
      in: query
      description: Page number
      schema:
        type: string
        default: "1"
    - name: limit
      in: query
      description: Items per page
      schema:
        type: string
        default: "10"
    - name: status
      in: query
      description: Filter by order status
      schema:
        type: string
        enum: [PENDING, COMPLETED, CANCELLED]
    - name: minAmount
      in: query
      description: Filter by minimum total amount
      schema:
        type: string
    - name: startDate
      in: query
      description: Filter by starting date-time range (ISO format)
      schema:
        type: string
    - name: endDate
      in: query
      description: Filter by ending date-time range (ISO format)
      schema:
        type: string
  responses:
    '200':
      description: Orders retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: Orders retrieved successfully
              data:
                type: array
                items:
                  $ref: '../components/order.yaml'
              meta:
                type: object
                properties:
                  total:
                    type: integer
                    example: 12
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
                  totalPages:
                    type: integer
                    example: 2
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../components/error.yaml'

post:
  tags:
    - Orders
  summary: Create a new order
  description: Check inventory stock, deduct stock atomically within a database transaction, and create a new order. Concurrency is handled to prevent race conditions. Queues a background job to send an invoice email with a PDF attachment.
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - items
          properties:
            items:
              type: array
              minItems: 1
              items:
                type: object
                required:
                  - productId
                  - quantity
                properties:
                  productId:
                    type: string
                    format: uuid
                    example: "d5cbb1fa-4fbb-49e0-811c-c7662b2e88a0"
                  quantity:
                    type: integer
                    minimum: 1
                    example: 2
  responses:
    '201':
      description: Order created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: Order created successfully
              data:
                $ref: '../components/order.yaml'
    '400':
      description: Bad Request (Invalid parameters / insufficient stock)
      content:
        application/json:
          schema:
            $ref: '../components/error.yaml'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../components/error.yaml'
