get:
  tags:
    - Products
  summary: List soft-deleted products (Archive)
  description: Retrieve a paginated and filtered list of soft-deleted products. Restricted to ADMIN.
  security:
    - BearerAuth: []
  parameters:
    - name: page
      in: query
      description: Page number
      schema:
        type: string
        default: "1"
    - name: limit
      in: query
      description: Items per page
      schema:
        type: string
        default: "10"
    - name: sort
      in: query
      description: Sorting criteria
      schema:
        type: string
    - name: search
      in: query
      description: Search query
      schema:
        type: string
  responses:
    '200':
      description: Archived products retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../components/paginated.products.yaml'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../components/error.yaml'
    '403':
      description: Forbidden (Only ADMIN can access)
      content:
        application/json:
          schema:
            $ref: '../components/error.yaml'
